function renderWorkoutWarmup(body){
  const selected = MUSCLES.filter(m=>warmupSelectedMuscles.has(m.key));

  const buildList = (phase)=>{
    // Aggregate stretches for selected muscles, de-duplicating by name and noting which muscles they cover
    const byName = new Map();
    selected.forEach(m=>{
      const entry = WARMUP_DB[m.key];
      if(!entry) return;
      entry[phase].forEach(s=>{
        if(!byName.has(s.name)){
          byName.set(s.name, {name:s.name, detail:s.detail, muscles:[m.key]});
        } else {
          byName.get(s.name).muscles.push(m.key);
        }
      });
    });
    return [...byName.values()];
  };

  const mobilityList = buildList('mobility');
  const beforeList = buildList('before');
  const afterList = buildList('after');

  const renderItems = (items)=> items.map(it=>`
    <div class="item-row">
      <div class="ii-main">
        <div class="ii-title">${escapeHtml(it.name)}</div>
        <div class="ii-sub">${escapeHtml(it.detail)}</div>
        <div class="micro-row">${it.muscles.map(mk=>`<span class="chip">${MUSCLE_LABEL[mk]}</span>`).join('')}</div>
      </div>
    </div>`).join('');

  body.innerHTML = `
    <div class="card">
      <div class="card-title-row"><span>Which muscle group(s) are you training?</span></div>
      <p class="help">Pick one or more — you'll get the most effective dynamic warmup moves to do before, and static stretches to do after.</p>
      <div class="muscle-picker-wrap">${MUSCLES.map(m=>`<button type="button" class="muscle-toggle ${warmupSelectedMuscles.has(m.key)?'on':''}" data-warmup-muscle="${m.key}">${m.label}</button>`).join('')}</div>
      ${selected.length>0 ? `<button class="btn sm mt" id="clearWarmupBtn">Clear selection</button>` : ''}
    </div>

    ${selected.length===0 ? `
      <div class="empty-state"><span class="ic">🧘</span><p>Select a muscle group above</p><p>We'll build a warmup + cooldown stretch routine for it.</p></div>
    ` : `
      <div class="section-head"><h2>🌀 Mobility Drills</h2><span class="tag muted">${mobilityList.length}</span></div>
      <p class="help">Do these first — slow, controlled range-of-motion work to prep the joint itself before you load it.</p>
      <div class="list">${renderItems(mobilityList)}</div>

      <div class="section-head"><h2>🔥 Before Training — Dynamic Warmup</h2><span class="tag muted">${beforeList.length}</span></div>
      <p class="help">Do 5 min of light general cardio first (brisk walk, bike, rower) to raise your body temperature, then run through these:</p>
      <div class="list">${renderItems(beforeList)}</div>

      <div class="section-head"><h2>🧊 After Training — Cooldown Stretches</h2><span class="tag muted">${afterList.length}</span></div>
      <p class="help">Hold each stretch gently to the point of light tension, never pain, and keep breathing.</p>
      <div class="list">${renderItems(afterList)}</div>
    `}
  `;

  body.querySelectorAll('[data-warmup-muscle]').forEach(b=>{
    b.onclick = ()=>{
      const key = b.dataset.warmupMuscle;
      if(warmupSelectedMuscles.has(key)) warmupSelectedMuscles.delete(key);
      else warmupSelectedMuscles.add(key);
      renderWorkoutWarmup(body);
    };
  });
  const clearBtn = document.getElementById('clearWarmupBtn');
  if(clearBtn) clearBtn.onclick = ()=>{ warmupSelectedMuscles.clear(); renderWorkoutWarmup(body); };
}

function renderDraftExerciseList(){
  const wrap = document.getElementById('draftExerciseList');
  if(!wrap) return;
  wrap.innerHTML = App.workoutDraft.exercises.map((de,ei)=>{
    const ex = EXERCISE_LIBRARY.find(x=>x.id===de.exerciseId);
    const prevBest = App.data.prs[de.exerciseId];
    const isCardio = ex && ex.cat === 'Cardio';
    const repPlaceholder = isCardio ? 'Minutes' : 'Reps';
    const weightPlaceholder = isCardio ? 'Level/Speed' : 'Weight (kg)';
    
    const setsHtml = de.sets.map((s,si)=>{
      const isPR = prevBest && estOneRM(s.weight,s.reps) > prevBest.est1RM;
      return `<div class="set-row-grid">
        <input type="number" placeholder="${repPlaceholder}" value="${s.reps||''}" data-ei="${ei}" data-si="${si}" data-f="reps" class="setInput">
        <input type="number" placeholder="${weightPlaceholder}" value="${s.weight||''}" data-ei="${ei}" data-si="${si}" data-f="weight" class="setInput" step="0.5">
        <select class="rpe-select setInput" data-ei="${ei}" data-si="${si}" data-f="rpe" title="Rate of Perceived Exertion">
          <option value="">RPE</option>
          ${[5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10].map(v=>`<option value="${v}" ${(s.rpe==v)?'selected':''}>${v}</option>`).join('')}
        </select>
        <div style="display:flex;gap:4px;align-items:center;">
          ${isPR?'<span class="pr-badge">PR</span>':''}
          <button class="iconbtn danger" data-delset="${ei}:${si}">✕</button>
        </div>
      </div>`;
    }).join('');
    const supTag = de.superset ? `<span class="superset-tag">🔗 Superset ${de.superset}</span>` : '';
    return `<div class="card ${de.superset?'superset-wrap':''}" style="background:var(--card2);padding:12px;">
      <div class="card-title-row">
        <div><div class="ii-title">${ex?ex.name:'Unknown'} ${supTag}</div><div class="ii-sub">${ex?`${ex.cat} (${ex.variation})`:''}</div></div>
        <div style="display:flex;gap:6px;">
          <button class="iconbtn" data-superset="${ei}" title="Group as superset">🔗</button>
          <button class="iconbtn" data-timer="${ei}">⏱</button>
          <button class="iconbtn danger" data-delex="${ei}">🗑</button>
        </div>
      </div>
      ${setsHtml}
      <button class="btn sm block" data-addset="${ei}">+ Add Set</button>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.setInput').forEach(inp=>{
    const handler = (e)=>{
      const {ei,si,f} = e.target.dataset;
      if(f==='rpe'){
        App.workoutDraft.exercises[+ei].sets[+si].rpe = e.target.value ? +e.target.value : null;
      } else {
        App.workoutDraft.exercises[+ei].sets[+si][f] = +e.target.value || 0;
      }
    };
    if(inp.tagName==='SELECT') inp.onchange = handler; else inp.oninput = handler;
  });
  wrap.querySelectorAll('[data-superset]').forEach(b=>b.onclick=()=>{
    const ei = +b.dataset.superset;
    const ex = App.workoutDraft.exercises;
    if(ex[ei].superset){
      // already grouped: ungroup it
      ex[ei].superset = null;
    } else {
      // find previous exercise to link with, else start a new group letter
      const usedLetters = new Set(ex.filter(x=>x.superset).map(x=>x.superset));
      let letter = null;
      if(ei>0 && ex[ei-1].superset){ letter = ex[ei-1].superset; }
      else {
        for(let c=65; c<91; c++){ const L=String.fromCharCode(c); if(!usedLetters.has(L)){ letter=L; break; } }
      }
      ex[ei].superset = letter;
      if(ei>0 && !ex[ei-1].superset) ex[ei-1].superset = letter;
    }
    renderDraftExerciseList();
  });
  wrap.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{
    const ei = +b.dataset.addset;
    const sets = App.workoutDraft.exercises[ei].sets;
    let newSet = {reps:0, weight:0, rpe:null};
    if(sets.length > 0) {
      newSet = {reps: sets[sets.length-1].reps, weight: sets[sets.length-1].weight, rpe: sets[sets.length-1].rpe||null};
    }
    sets.push(newSet);
    renderDraftExerciseList();
  });
  wrap.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{
    const [ei,si] = b.dataset.delset.split(':').map(Number);
    App.workoutDraft.exercises[ei].sets.splice(si,1);
    renderDraftExerciseList();
  });
  wrap.querySelectorAll('[data-delex]').forEach(b=>b.onclick=()=>{
    App.workoutDraft.exercises.splice(+b.dataset.delex,1);
    renderWorkoutLog(document.getElementById('workoutTabBody'));
  });
  wrap.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>startRestTimer(90));
}

        document.getElementById('modalRoot2').innerHTML = '';

  }

function saveDraftWorkout(){
  const d = App.workoutDraft;
  const validExercises = d.exercises.filter(e=>e.sets.some(s=>s.reps>0));
  if(validExercises.length===0){ toast('Add at least one completed set'); return; }
  let newPRs = 0;
  validExercises.forEach(de=>{
    de.sets.forEach(s=>{
      if(!s.reps || !s.weight) return;
      const est = estOneRM(s.weight, s.reps);
      const cur = App.data.prs[de.exerciseId];
      if(!cur || est > cur.est1RM){
        App.data.prs[de.exerciseId] = {weight:s.weight, reps:s.reps, est1RM:est, date:d.date};
        newPRs++;
      }
    });
  });
  
  if(d.id) {
      App.data.workouts = App.data.workouts.filter(w=>w.id !== d.id);
  }
  App.data.workouts.push({id: d.id || uid(), date:d.date, exercises:validExercises});
  
  persist();
  App.workoutDraft = {date: todayStr(), exercises:[]};
  toast(newPRs>0 ? `Workout saved — ${newPRs} new PR${newPRs>1?'s':''}! 🎉` : 'Workout saved!');
  renderWorkoutPage();
}

function startRestTimer(seconds){
  clearRestTimer();
  App.restTimer = { remaining: seconds, total: seconds };
  renderRestTimer();
  App.restTimerInterval = setInterval(()=>{
    App.restTimer.remaining--;
    if(App.restTimer.remaining<=0){ clearRestTimer(); toast('Rest complete — go!'); if(navigator.vibrate) navigator.vibrate(200); return; }
    renderRestTimer();
  }, 1000);
}
function renderRestTimer(){
  const root = document.getElementById('restTimerRoot');
  if(!App.restTimer){ root.innerHTML=''; return; }
  const m = Math.floor(App.restTimer.remaining/60), s=App.restTimer.remaining%60;
  root.innerHTML = `<div class="rest-timer">
    <span>⏱ Rest ${m}:${String(s).padStart(2,'0')}</span>
    <button id="addTimeBtn">+15s</button>
    <button id="stopTimerBtn">✕</button>
  </div>`;
  document.getElementById('addTimeBtn').onclick = ()=>{ App.restTimer.remaining+=15; renderRestTimer(); };
  document.getElementById('stopTimerBtn').onclick = clearRestTimer;
}
function clearRestTimer(){ clearInterval(App.restTimerInterval); App.restTimer=null; const root=document.getElementById('restTimerRoot'); if(root) root.innerHTML=''; }

// ===================== Food List (all foods, sortable) =====================
let foodListSort = 'name';
let foodListSearch = '';
const FOOD_LIST_SORTS = {
  'name':        { label: 'Name (A–Z)',                cmp: (a,b)=> a.name.localeCompare(b.name) },
  'protein':     { label: 'Protein (High → Low)',       cmp: (a,b)=> b.p - a.p },
  'protein-asc': { label: 'Protein (Low → High)',       cmp: (a,b)=> a.p - b.p },
  'kcal-asc':    { label: 'Calories (Low → High)',      cmp: (a,b)=> a.kcal - b.kcal },
  'kcal-desc':   { label: 'Calories (High → Low)',      cmp: (a,b)=> b.kcal - a.kcal },
  'ratio-desc':  { label: 'High Protein, Low Calorie',  cmp: (a,b)=> (b.p/(b.kcal||1)) - (a.p/(a.kcal||1)) },
  'ratio-asc':   { label: 'Low Protein, High Calorie',  cmp: (a,b)=> (a.p/(a.kcal||1)) - (b.p/(b.kcal||1)) },
};

function renderFoodList(body){
  const allFoods = getAllFoodsWithOverrides();

  // Shell (input/select) is rendered ONCE. Re-rendering the input on every
  // keystroke (via body.innerHTML) would destroy and recreate the element,
  // stealing focus and dismissing the mobile keyboard after each key press.
  // Only the results list below is refreshed on input/sort changes.
  body.innerHTML = `
    <div class="card">
      <div class="card-title-row"><h3 style="margin:0;">Food List <span class="tag muted" id="foodListCount">${allFoods.length}</span></h3></div>
      <div class="search-row">
        <input type="text" id="foodListSearch" placeholder="Search foods..." autocomplete="off" value="${escapeHtml(foodListSearch)}">
        <select id="foodListSortSel" style="width:auto;">
          ${Object.entries(FOOD_LIST_SORTS).map(([k,v])=>`<option value="${k}" ${foodListSort===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <div id="foodListResults" class="mt"></div>
    </div>`;

  function drawResults(){
    const q = foodListSearch.toLowerCase();
    const filtered = q ? allFoods.filter(f=>f.name.toLowerCase().includes(q)) : allFoods.slice();
    filtered.sort(FOOD_LIST_SORTS[foodListSort].cmp);

    document.getElementById('foodListCount').textContent = filtered.length;
    document.getElementById('foodListResults').innerHTML =
      filtered.length===0 ? `<div class="empty-state"><span class="ic">🥗</span><p>No foods match your search.</p></div>` :
      `<div class="list">${filtered.map(f=>`
        <div class="item-row">
          <div class="ii-main"><div class="ii-title">${escapeHtml(f.name)}</div>
          <div class="ii-sub">${f.unit} · ${f.kcal} kcal · P${round1(f.p)} C${round1(f.c)} F${round1(f.f)}</div></div>
          <div class="ii-actions">
            <button class="iconbtn" data-editfl="${f.id}" title="Edit">✏️</button>
            <button class="iconbtn" data-addfl="${f.id}" title="Add to today's log">➕</button>
          </div>
        </div>`).join('')}</div>`;

    document.getElementById('foodListResults').querySelectorAll('[data-editfl]').forEach(b=>b.onclick=()=>{
      const food = allFoods.find(f=>f.id===b.dataset.editfl);
      openEditFoodModal(food, ()=>{ renderFoodList(body); });
    });
    document.getElementById('foodListResults').querySelectorAll('[data-addfl]').forEach(b=>b.onclick=()=>{
      const food = allFoods.find(f=>f.id===b.dataset.addfl);
      openQtyPrompt(food, dietDate, 'diet');
    });
  }

  document.getElementById('foodListSearch').oninput = (e)=>{ foodListSearch = e.target.value; drawResults(); };
  document.getElementById('foodListSortSel').onchange = (e)=>{ foodListSort = e.target.value; drawResults(); };
  drawResults();
}

// Shared edit modal for ANY food — built-in FOOD_DB items (mutton curry, sambar, chutneys,
// oils, spices, etc.) as well as personal "My Foods" entries. Built-in edits are stored as
// a per-profile override; personal foods are updated directly. onSaved (optional) re-renders
// the caller's list after a save/reset so changes show immediately.
function openEditFoodModal(food, onSaved){
  if(!food) return;
  const isPersonal = (App.data.personalFoods||[]).some(f=>f.id===food.id);
  const hasOverride = !isPersonal && App.data.foodOverrides && App.data.foodOverrides[food.id];
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="mbEf">
      <div class="modal">
        <div class="modal-head"><h2>Edit Food</h2><button class="modal-close" id="mcEf">&times;</button></div>
        <div class="field"><label>Name</label><input type="text" id="efName" value="${escapeHtml(food.name)}"></div>
        <div class="field"><label>Serving Unit</label><input type="text" id="efUnit" value="${escapeHtml(food.unit)}"></div>
        <div class="field"><label>Grams per Unit (Optional)</label><input type="number" id="efGrams" value="${food.gPerUnit||''}"></div>
        <div class="field-row">
          <div class="field"><label>Calories</label><input type="number" id="efKcal" value="${food.kcal}"></div>
          <div class="field"><label>Protein (g)</label><input type="number" id="efP" value="${food.p}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Carbs (g)</label><input type="number" id="efC" value="${food.c}"></div>
          <div class="field"><label>Fat (g)</label><input type="number" id="efF" value="${food.f}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Fiber (g)</label><input type="number" id="efFiber" value="${food.fiber||0}"></div>
          <div class="field"><label>Sugar (g)</label><input type="number" id="efSugar" value="${food.sugar||0}"></div>
        </div>
        <button class="btn primary block" id="saveEfBtn">Save Changes</button>
        ${hasOverride ? `<button class="btn sm block" id="resetEfBtn" style="margin-top:8px;">Reset to Default</button>` : ''}
      </div>
    </div>`;
  document.getElementById('mcEf').onclick = closeModal;
  document.getElementById('mbEf').onclick = (e)=>{ if(e.target.id==='mbEf') closeModal(); };
  document.getElementById('saveEfBtn').onclick = ()=>{
    const name = document.getElementById('efName').value.trim();
    if(!name){ toast('Enter a food name'); return; }
    const updated = {
      name, unit: document.getElementById('efUnit').value.trim() || food.unit,
      kcal:+document.getElementById('efKcal').value||0, p:+document.getElementById('efP').value||0,
      c:+document.getElementById('efC').value||0, f:+document.getElementById('efF').value||0,
      fiber:+document.getElementById('efFiber').value||0, sugar:+document.getElementById('efSugar').value||0,
    };
    const gpU = +document.getElementById('efGrams').value;
    if (gpU > 0) updated.gPerUnit = gpU;

    if(isPersonal){
      const idx = App.data.personalFoods.findIndex(f=>f.id===food.id);
      if(idx>-1) App.data.personalFoods[idx] = {...App.data.personalFoods[idx], ...updated};
    } else {
      App.data.foodOverrides = App.data.foodOverrides || {};
      App.data.foodOverrides[food.id] = updated;
    }
    persist(); closeModal(); toast('Food updated');
    if (typeof onSaved === 'function') onSaved();
  };
  const resetBtn = document.getElementById('resetEfBtn');
  if(resetBtn){
    resetBtn.onclick = ()=>{
      if(App.data.foodOverrides) delete App.data.foodOverrides[food.id];
      persist(); closeModal(); toast('Reset to default');
      if (typeof onSaved === 'function') onSaved();
    };
  }
}

function getPrepMultiplier(foodType, prepState) {
    if (prepState === 'Raw') return 1.0;
    if (foodType === 'dry_seed') return 0.333; 
    if (foodType === 'meat') return 1.333;
    if (foodType === 'veg') return 1.1;
    return 1.0;
}

function openQtyPrompt(food, targetDate, returnPage, existingLog = null){
  const hasGrams = !!food.gPerUnit;
  const showPrep = !!food.prep;
  
  let currentState = 'Raw';
  if(existingLog) {
      if(existingLog.name.includes('(Boiled)')) currentState = 'Boiled';
      if(existingLog.name.includes('(Cooked / Roasted)')) currentState = 'Cooked';
  }
  let currentMult = getPrepMultiplier(food.type || 'general', currentState);
  
  const initQty = existingLog ? existingLog.qty : 1;
  const initGrams = existingLog && hasGrams ? round1(initQty * food.gPerUnit) : (hasGrams ? food.gPerUnit : '');

  const root = document.getElementById('modalRoot2');
  root.innerHTML = `
    <div class="modal-backdrop" id="mb2">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h2>${existingLog ? 'Edit' : 'Add'} ${escapeHtml(food.name)}</h2><button class="modal-close" id="mc2">&times;</button></div>
        ${showPrep ? `
        <div class="field">
          <label>Preparation State</label>
          <div class="toggle-pill" id="prepPill">
            <button type="button" data-prep="Raw" class="${currentState==='Raw'?'on':''}">Raw</button>
            <button type="button" data-prep="Boiled" class="${currentState==='Boiled'?'on':''}">Boiled</button>
            <button type="button" data-prep="Cooked" class="${currentState==='Cooked'?'on':''}">Cooked/Roasted</button>
          </div>
        </div>` : ''}
        <p class="help" id="macroHelpTxt">Per ${food.unit}${showPrep?` (${currentState})`:''}: ${Math.round(food.kcal*currentMult)} kcal · P${round1(food.p*currentMult)}g C${round1(food.c*currentMult)}g F${round1(food.f*currentMult)}g</p>
        <div class="field">
            <label>Quantity (${food.unit})</label>
            <input type="number" id="qtyInput" value="${initQty}" step="0.25" min="0">
        </div>
        ${hasGrams ? `
        <div class="field">
            <label>Or enter in Grams</label>
            <input type="number" id="gramInput" value="${initGrams}" min="0">
        </div>` : ''}
        <button class="btn primary block" id="confirmQty" style="margin-top:14px;">${existingLog ? 'Save Changes' : 'Add to Log'}</button>
      </div>
    </div>`;
    
  function updateMacroText(){
    const perK = Math.round(food.kcal * currentMult);
    const perP = round1(food.p * currentMult);
    const perC = round1(food.c * currentMult);
    const perF = round1(food.f * currentMult);
    document.getElementById('macroHelpTxt').textContent = `Per ${food.unit}${showPrep?` (${currentState})`:''}: ${perK} kcal · P${perP}g C${perC}g F${perF}g`;
  }

  if(showPrep){
    document.getElementById('prepPill').querySelectorAll('[data-prep]').forEach(b=>{
      b.onclick = () => {
        currentState = b.dataset.prep;
        currentMult = getPrepMultiplier(food.type || 'general', currentState);
        document.getElementById('prepPill').querySelectorAll('[data-prep]').forEach(x=>x.classList.toggle('on', x===b));
        updateMacroText();
      };
    });
  }

  if (hasGrams) {
      document.getElementById('qtyInput').oninput = (e) => { 
          if(e.target.value !== '') document.getElementById('gramInput').value = round1(e.target.value * food.gPerUnit); 
      };
      document.getElementById('gramInput').oninput = (e) => { 
          if(e.target.value !== '') document.getElementById('qtyInput').value = round1(e.target.value / food.gPerUnit); 
      };
  }

  document.getElementById('mc2').onclick = ()=>document.getElementById('modalRoot2').innerHTML='';
  document.getElementById('mb2').onclick = (e)=>{ if(e.target.id==='mb2') document.getElementById('modalRoot2').innerHTML=''; };
  document.getElementById('confirmQty').onclick = ()=>{
    const qty = +document.getElementById('qtyInput').value || 1;
    
    const finalName = currentState === 'Raw' ? food.name : `${food.name} (${currentState})`;
    
    const fiberVal = round1((food.fiber||0) * currentMult * qty);
    const sugarVal = round1((food.sugar||0) * currentMult * qty);

    if (returnPage === 'mealBuilder') {
        window._tempMealFoods = window._tempMealFoods || [];
        window._tempMealFoods.push({
            foodId:food.id, name:finalName, qty:round1(qty),
            kcal: Math.round(food.kcal * currentMult * qty), 
            p: round1(food.p * currentMult * qty), 
            c: round1(food.c * currentMult * qty), 
            f: round1(food.f * currentMult * qty),
            fiber: fiberVal, sugar: sugarVal
        });
        document.getElementById('modalRoot2').innerHTML='';
        if (window._renderMealChips) window._renderMealChips();
        return;
    }

    if (existingLog) {
        existingLog.name = finalName;
        existingLog.qty = round1(qty);
        existingLog.kcal = Math.round(food.kcal * currentMult * qty);
        existingLog.p = round1(food.p * currentMult * qty);
        existingLog.c = round1(food.c * currentMult * qty);
        existingLog.f = round1(food.f * currentMult * qty);
        existingLog.fiber = fiberVal;
        existingLog.sugar = sugarVal;
        persist(); document.getElementById('modalRoot2').innerHTML=''; toast('Log updated');
        if(returnPage === 'diet') renderDietPage();
        else if(returnPage === 'missed') renderMissedPage();
        return;
    }

    App.data.foodLogs.push({
      id:uid(), date:targetDate, foodId:food.id, name:finalName, qty:round1(qty),
      kcal: Math.round(food.kcal * currentMult * qty), 
      p: round1(food.p * currentMult * qty), 
      c: round1(food.c * currentMult * qty), 
      f: round1(food.f * currentMult * qty),
      fiber: fiberVal, sugar: sugarVal
    });
    persist(); document.getElementById('modalRoot2').innerHTML=''; toast('Added to log');
    
    if(returnPage === 'diet') renderDietPage();
    else if(returnPage === 'missed') renderMissedPage();
  };
}

// ===================== Ad-hoc Recipe / Combo Builder =====================
// Lets a user combine several base foods (each with its own quantity) into
// a single logged entry, since a dish like "Soya chunks curry" is really
// soya chunks + onion + tomato + oil + spices, and the amounts of each
// differ every time it's cooked.
function openRecipeBuilder(targetDate, returnPage){
  const allFoodsList = getAllFoodsWithOverrides();
  window._tempRecipeItems = [];

  const root = document.getElementById('modalRoot2');
  root.innerHTML = `
    <div class="modal-backdrop" id="mbR">
      <div class="modal" style="max-width:460px;">
        <div class="modal-head"><h2>Build a Recipe / Combo</h2><button class="modal-close" id="mcR">&times;</button></div>
        <p class="help">Combine multiple ingredients into one log entry — quantities can differ every time you cook it.</p>
        <div class="field"><label>Recipe / Dish Name</label><input type="text" id="recipeName" placeholder="e.g. Soya Chunks Curry"></div>
        <div class="list" id="recipeItemList" style="margin:10px 0;"></div>
        <button class="btn sm" id="addIngredientBtn">+ Add Ingredient</button>
        <div class="blend-card" style="margin-top:14px;">
          <div id="recipeTotals" class="help">0 kcal · P0g C0g F0g</div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;">
          <input type="checkbox" id="saveAsPersonal"> Also save as a reusable food in "My Foods"
        </label>
        <button class="btn primary block" id="confirmRecipe">Add to Log</button>
      </div>
    </div>`;

  function computeTotals(){
    return window._tempRecipeItems.reduce((a,it)=>({
      kcal:a.kcal+it.kcal, p:a.p+it.p, c:a.c+it.c, f:a.f+it.f,
      fiber:a.fiber+(it.fiber||0), sugar:a.sugar+(it.sugar||0)
    }), {kcal:0,p:0,c:0,f:0,fiber:0,sugar:0});
  }

  function renderItems(){
    document.getElementById('recipeItemList').innerHTML = window._tempRecipeItems.map((it, idx)=>`
      <div class="recipe-row">
        <div class="ii-main"><div class="ii-title">${escapeHtml(it.name)}</div><div class="ii-sub">${it.grams}g · ${it.kcal} kcal</div></div>
        <button class="iconbtn danger" data-rmrec="${idx}">🗑</button>
      </div>`).join('') || `<span class="muted" style="font-size:12px;">No ingredients added yet.</span>`;
    document.getElementById('recipeItemList').querySelectorAll('[data-rmrec]').forEach(b=>{
      b.onclick = ()=>{ window._tempRecipeItems.splice(+b.dataset.rmrec,1); renderItems(); };
    });
    const t = computeTotals();
    document.getElementById('recipeTotals').textContent = `Total: ${Math.round(t.kcal)} kcal · P${round1(t.p)}g C${round1(t.c)}g F${round1(t.f)}g · Fiber ${round1(t.fiber)}g · Sugar ${round1(t.sugar)}g`;
  }

  document.getElementById('addIngredientBtn').onclick = ()=>{
    openIngredientPicker(allFoodsList, (item)=>{
      window._tempRecipeItems.push(item);
      renderItems();
    });
  };

  document.getElementById('mcR').onclick = ()=>document.getElementById('modalRoot2').innerHTML='';
  document.getElementById('mbR').onclick = (e)=>{ if(e.target.id==='mbR') document.getElementById('modalRoot2').innerHTML=''; };

  document.getElementById('confirmRecipe').onclick = ()=>{
    const name = document.getElementById('recipeName').value.trim();
    if(!name){ toast('Name your recipe'); return; }
    if(window._tempRecipeItems.length===0){ toast('Add at least one ingredient'); return; }
    const t = computeTotals();
    const totalGrams = window._tempRecipeItems.reduce((a,it)=>a+it.grams,0);

    if(document.getElementById('saveAsPersonal').checked){
      App.data.personalFoods = App.data.personalFoods||[];
      App.data.personalFoods.push({
        id:uid(), name, type:'general', unit:`${Math.round(totalGrams)}g (whole recipe)`, gPerUnit: totalGrams || 100,
        kcal:Math.round(t.kcal), p:round1(t.p), c:round1(t.c), f:round1(t.f), fiber:round1(t.fiber), sugar:round1(t.sugar)
      });
      persist();
    }

    const entry = {
      id:uid(), date:targetDate, foodId:null, name, qty:1,
      kcal:Math.round(t.kcal), p:round1(t.p), c:round1(t.c), f:round1(t.f), fiber:round1(t.fiber), sugar:round1(t.sugar)
    };

    if (returnPage === 'mealBuilder') {
      window._tempMealFoods = window._tempMealFoods || [];
      window._tempMealFoods.push(entry);
      document.getElementById('modalRoot2').innerHTML='';
      if (window._renderMealChips) window._renderMealChips();
      return;
    }

    App.data.foodLogs.push(entry);
    persist(); document.getElementById('modalRoot2').innerHTML=''; toast('Recipe added to log');
    if(returnPage === 'diet') renderDietPage();
    else if(returnPage === 'missed') renderMissedPage();
  };

  renderItems();
}

// Small helper picker used inside the recipe builder & protein blend editor —
// pick a base food, then specify grams for this particular use.
function openIngredientPicker(allFoodsList, onPick){
  const root = document.getElementById('modalRoot3') || (()=>{
    const d = document.createElement('div'); d.id='modalRoot3'; document.body.appendChild(d); return d;
  })();
  root.innerHTML = `
    <div class="modal-backdrop" id="mbI" style="z-index:170;">
      <div class="modal pick-modal" style="max-width:420px;">
        <div class="modal-head"><h2>Add Ingredient</h2><button class="modal-close" id="mcI">&times;</button></div>
        <div class="search-row"><input type="text" id="ingSearch" placeholder="Search ingredients..." autocomplete="off"></div>
        <div class="pick-scroll"><div class="list" id="ingPickList"></div></div>
      </div>
    </div>`;
  function refresh(){
    const q = document.getElementById('ingSearch').value.toLowerCase();
    const list = q ? allFoodsList.filter(f=>f.name.toLowerCase().includes(q)) : allFoodsList;
    document.getElementById('ingPickList').innerHTML = list.map(f=>`
      <div class="item-row" style="cursor:pointer;" data-id="${f.id}">

// ===================== Protein Powder Blend =====================
// A special editable "recipe" that gets overwritten each time the user
// re-blends a fresh batch (different ingredients/grams allowed each time).
function renderProteinBlend(body){
  const allFoodsList = getAllFoodsWithOverrides();
  const blend = App.data.proteinBlend;
  window._tempBlendItems = blend ? blend.items.map(it=>({...it})) : [
    {foodId:'black-chana', name:'Black Chana (roasted)', grams:120, kcal:0,p:0,c:0,f:0,fiber:0,sugar:0},
    {foodId:'green-gram', name:'Green Gram (roasted)', grams:143, kcal:0,p:0,c:0,f:0,fiber:0,sugar:0},
    {foodId:'pumpkin-seeds', name:'Pumpkin Seeds (roasted)', grams:20, kcal:0,p:0,c:0,f:0,fiber:0,sugar:0},
    {foodId:'flax-seeds', name:'Flax Seeds', grams:15, kcal:0,p:0,c:0,f:0,fiber:0,sugar:0},
    {foodId:'sesame-seeds', name:'Sesame Seeds', grams:15, kcal:0,p:0,c:0,f:0,fiber:0,sugar:0},
  ];
  // fill in macro values for default/prefilled items using cooked multiplier where relevant
  window._tempBlendItems.forEach(it=>{
    const f = allFoodsList.find(x=>x.id===it.foodId);
    if(f && !it.kcal){
      const mult = it.name.toLowerCase().includes('roasted') ? getPrepMultiplier(f.type,'Cooked') : 1;
      const ratio = (it.grams/(f.gPerUnit||100)) * mult;
      it.kcal = Math.round(f.kcal*ratio); it.p = round1(f.p*ratio); it.c = round1(f.c*ratio); it.f = round1(f.f*ratio);
      it.fiber = round1((f.fiber||0)*ratio); it.sugar = round1((f.sugar||0)*ratio);
    }
  });

  body.innerHTML = `
    <div class="card">
      <div class="card-title-row"><h3 style="margin:0;">🥤 My Protein Powder Blend</h3></div>
      <p class="help">Blend ingredients below. Saving <b>overwrites</b> your previous blend — use this each time you run out and mix a fresh batch, with different grams or ingredients.</p>
      <div class="field"><label>Blend Name</label><input type="text" id="blendName" value="${escapeHtml(blend?.name || 'My Protein Blend')}"></div>
      <div class="list" id="blendItemList" style="margin:10px 0;"></div>
      <button class="btn sm" id="addBlendIngredientBtn">+ Add Ingredient</button>
      <div class="blend-card" style="margin-top:14px;">
        <div id="blendTotals" class="help"></div>
        <div class="field" style="margin-top:8px;">
          <label>Serving size (grams per scoop)</label>
          <input type="number" id="servingGrams" value="${blend?.servingGrams || 30}" min="1">
        </div>
        <div id="blendPerServing" class="help"></div>
      </div>
      <button class="btn primary block" id="saveBlendBtn" style="margin-top:12px;">💾 Save Blend (overwrites previous)</button>
      ${blend ? `<button class="btn block" id="logBlendServingBtn" style="margin-top:8px;">+ Log a Serving to Today</button>` : ''}
    </div>`;

  function computeTotals(){
    return window._tempBlendItems.reduce((a,it)=>({
      grams:a.grams+it.grams, kcal:a.kcal+it.kcal, p:a.p+it.p, c:a.c+it.c, f:a.f+it.f,
      fiber:a.fiber+(it.fiber||0), sugar:a.sugar+(it.sugar||0)
    }), {grams:0,kcal:0,p:0,c:0,f:0,fiber:0,sugar:0});
  }

  function renderItems(){
    document.getElementById('blendItemList').innerHTML = window._tempBlendItems.map((it, idx)=>`
      <div class="recipe-row">
        <div class="ii-main"><div class="ii-title">${escapeHtml(it.name)}</div><div class="ii-sub">${it.kcal} kcal</div></div>
        <input type="number" data-gramsedit="${idx}" value="${it.grams}" min="0">
        <span class="muted" style="font-size:12px;">g</span>
        <button class="iconbtn danger" data-rmblend="${idx}">🗑</button>
      </div>`).join('') || `<span class="muted" style="font-size:12px;">No ingredients yet.</span>`;

    document.getElementById('blendItemList').querySelectorAll('[data-rmblend]').forEach(b=>{
      b.onclick = ()=>{ window._tempBlendItems.splice(+b.dataset.rmblend,1); renderItems(); };
    });
    document.getElementById('blendItemList').querySelectorAll('[data-gramsedit]').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = +inp.dataset.gramsedit;
        const it = window._tempBlendItems[idx];
        const f = allFoodsList.find(x=>x.id===it.foodId);
        const newGrams = +inp.value || 0;
        if(f){
          const ratio = newGrams/(f.gPerUnit||100);
          it.grams=newGrams; it.kcal=Math.round(f.kcal*ratio); it.p=round1(f.p*ratio); it.c=round1(f.c*ratio); it.f=round1(f.f*ratio);
          it.fiber=round1((f.fiber||0)*ratio); it.sugar=round1((f.sugar||0)*ratio);
        } else { it.grams = newGrams; }
        renderItems();
      };
    });

    const t = computeTotals();
    document.getElementById('blendTotals').textContent = `Whole batch (${round1(t.grams)}g): ${Math.round(t.kcal)} kcal · P${round1(t.p)}g C${round1(t.c)}g F${round1(t.f)}g · Fiber ${round1(t.fiber)}g`;
    const servingGrams = +document.getElementById('servingGrams').value || 30;
    const sr = t.grams ? servingGrams/t.grams : 0;
    document.getElementById('blendPerServing').textContent = `Per ${servingGrams}g serving: ${Math.round(t.kcal*sr)} kcal · P${round1(t.p*sr)}g C${round1(t.c*sr)}g F${round1(t.f*sr)}g`;
  }

  document.getElementById('servingGrams').oninput = renderItems;

  document.getElementById('addBlendIngredientBtn').onclick = ()=>{
    openIngredientPicker(allFoodsList, (item)=>{
      window._tempBlendItems.push(item);
      renderItems();
    });
  };

  document.getElementById('saveBlendBtn').onclick = ()=>{
    if(window._tempBlendItems.length===0){ toast('Add at least one ingredient'); return; }
    const t = computeTotals();
    App.data.proteinBlend = {
      name: document.getElementById('blendName').value.trim() || 'My Protein Blend',
      items: window._tempBlendItems.map(it=>({...it})),
      totalGrams: round1(t.grams),
      servingGrams: +document.getElementById('servingGrams').value || 30,
      updated: todayStr()
    };
    persist(); toast('Blend saved — previous blend overwritten'); renderProteinBlend(body);
  };

  const logBtn = document.getElementById('logBlendServingBtn');
  if(logBtn) logBtn.onclick = ()=>openBlendLogPrompt(dietDate, 'diet');

  renderItems();
}

  root.innerHTML = `
    <div class="modal-backdrop" id="mbBL">
      <div class="modal" style="max-width:360px;">
        <div class="modal-head"><h2>Log ${escapeHtml(blend.name)}</h2><button class="modal-close" id="mcBL">&times;</button></div>
        <p class="help">Whole batch is ${round1(blend.totalGrams)}g · ${Math.round(t.kcal)} kcal total.</p>

        <button class="btn primary block" id="confirmBlendLog" style="margin-top:10px;">Add to Log</button>
      </div>

  document.getElementById('mbBL').onclick = (e)=>{ if(e.target.id==='mbBL') document.getElementById('modalRoot2').innerHTML=''; };
  document.getElementById('confirmBlendLog').onclick = ()=>{
    const grams = +document.getElementById('blendGramsIn').value || 0;
    const ratio = blend.totalGrams ? grams/blend.totalGrams : 0;
    const entry = {
      id:uid(), date:targetDate, foodId:null, name:`${blend.name} (${round1(grams)}g)`, qty:1,
      kcal:Math.round(t.kcal*ratio), p:round1(t.p*ratio), c:round1(t.c*ratio), f:round1(t.f*ratio),
      fiber:round1(t.fiber*ratio), sugar:round1(t.sugar*ratio)
    };
    if (returnPage === 'mealBuilder') {
      window._tempMealFoods = window._tempMealFoods || [];

      document.getElementById('modalRoot2').innerHTML='';
      if (window._renderMealChips) window._renderMealChips();
      return;
    }
    App.data.foodLogs.push(entry);
    persist(); document.getElementById('modalRoot2').innerHTML=''; toast('Blend serving logged');
    if(returnPage === 'diet') renderDietPage();
    else if(returnPage === 'missed') renderMissedPage();
  };
}

const WEEK_DAYS = [
  {key:'mon', label:'Monday'},

  {key:'thu', label:'Thursday'},
  {key:'fri', label:'Friday'},

];
function blankWeekTemplateDays(){
  const days = {};
  WEEK_DAYS.forEach(d => days[d.key] = {split:'', exerciseIds:[]});

}
function todayWeekDayKey(){
  // JS getDay(): 0=Sun..6=Sat -> map to WEEK_DAYS index (0=mon..6=sun)
  return WEEK_DAYS[(new Date().getDay() + 6) % 7].key;
}

// Finds the most recently logged sets for a given exercise across all saved workouts.
function getLastLoggedForExercise(exerciseId){
    if(!App.data || !App.data.workouts) return null;
    const workouts = [...App.data.workouts].sort((a,b)=>b.date.localeCompare(a.date));
    for(const w of workouts){
        const ex = w.exercises.find(e=>e.exerciseId===exerciseId);
        if(ex && ex.sets && ex.sets.length>0){
            return {date: w.date, sets: ex.sets};
        }
    }
    return null;
}

    const todayKey = todayWeekDayKey();

            return `<div class="card" style="${isToday?'border-left:4px solid var(--accent);':''}">
                <div class="card-title-row">
                    <h3 style="margin:0;font-size:14px;">${d.label}${isToday?' <span class="chip on" style="margin-left:6px;">Today</span>':''}</h3>

function openWeekTemplateModal(existingId){
    const existing = existingId ? (App.data.weekTemplates||[]).find(t=>t.id===existingId) : null;
    window._tempWeekDays = existing ? JSON.parse(JSON.stringify(existing.days)) : blankWeekTemplateDays();
    WEEK_DAYS.forEach(d=>{ if(!window._tempWeekDays[d.key]) window._tempWeekDays[d.key] = {split:'', exerciseIds:[]}; });

    const root = document.getElementById('modalRoot');
    root.innerHTML = `
        <div class="modal-backdrop" id="mbWeekTmpl">
            <div class="modal">
                <div class="modal-head"><h2>${existing?'Edit':'New'} Weekly Template</h2><button class="modal-close" id="mcWeekTmpl">&times;</button></div>
                <div class="field"><label>Template Name</label><input type="text" id="weekTmplName" placeholder="e.g. Push Pull Legs" value="${existing?escapeHtml(existing.name):''}"></div>
                <div id="weekTmplDays" style="display:flex;flex-direction:column;gap:10px;margin-top:12px;"></div>
                <button class="btn primary block mt" id="saveWeekTmplBtn" style="margin-top:20px;">Save Template</button>
            </div>
        </div>
    `;

    function renderDays(){
        document.getElementById('weekTmplDays').innerHTML = WEEK_DAYS.map(d=>{
            const day = window._tempWeekDays[d.key];
            const exChips = (day.exerciseIds||[]).map((exId, idx)=>{
                const exDef = EXERCISE_LIBRARY.find(x=>x.id===exId);
                return `<div class="item-row" style="padding:6px 8px;">
                    <div class="ii-main"><div class="ii-title" style="font-size:12.5px;">${exDef?exDef.name:'Unknown'}</div></div>
                    <button class="iconbtn danger" style="width:24px;height:24px;font-size:11px;" data-rmex="${d.key}:${idx}">✕</button>
                </div>`;
            }).join('') || '<div class="empty-state" style="padding:6px;"><p style="font-size:11px;">No exercises added</p></div>';

            return `<div class="card" style="background:var(--card2);padding:12px;">
                <div style="font-weight:bold;font-size:13px;margin-bottom:8px;">${d.label}</div>
                <input type="text" placeholder="Name this day's split (e.g. Chest Tri Abs)" value="${escapeHtml(day.split||'')}" data-splitday="${d.key}" style="margin-bottom:8px;">
                <div style="display:flex;flex-direction:column;gap:6px;">${exChips}</div>
                <button class="btn sm ghost mt" data-addexday="${d.key}" style="padding:4px 8px;color:var(--accent2);">+ Add Exercise</button>
            </div>`;
        }).join('');

        document.getElementById('weekTmplDays').querySelectorAll('[data-splitday]').forEach(inp=>{
            inp.onchange = () => { window._tempWeekDays[inp.dataset.splitday].split = inp.value; };
        });
        document.getElementById('weekTmplDays').querySelectorAll('[data-rmex]').forEach(btn=>{
            btn.onclick = () => {
                const [dk, idx] = btn.dataset.rmex.split(':');
                window._tempWeekDays[dk].exerciseIds.splice(+idx, 1);
                renderDays();
            };
        });
        document.getElementById('weekTmplDays').querySelectorAll('[data-addexday]').forEach(btn=>{
            btn.onclick = () => {
                const dk = btn.dataset.addexday;
                openExercisePicker((id) => {
                    window._tempWeekDays[dk].exerciseIds.push(id);
                    renderDays();
                });
            };
        });
    }
    renderDays();

    document.getElementById('mcWeekTmpl').onclick = closeModal;
    document.getElementById('mbWeekTmpl').onclick = (e) => { if(e.target.id === 'mbWeekTmpl') closeModal(); };

    document.getElementById('saveWeekTmplBtn').onclick = () => {
        const name = document.getElementById('weekTmplName').value.trim();
        if(!name){ toast('Please enter a template name'); return; }
        const hasAnyExercise = WEEK_DAYS.some(d => (window._tempWeekDays[d.key].exerciseIds||[]).length > 0);
        if(!hasAnyExercise){ toast('Add at least one exercise to at least one day'); return; }

        App.data.weekTemplates = App.data.weekTemplates || [];

        if(existing){
            existing.name = name;
            existing.days = JSON.parse(JSON.stringify(window._tempWeekDays));
        } else {
            const t = {id: uid(), name, days: JSON.parse(JSON.stringify(window._tempWeekDays))};
            App.data.weekTemplates.push(t);
            if(!App.data.activeWeekTemplateId) App.data.activeWeekTemplateId = t.id;
        }
        persist();
        closeModal();
        renderSchedulerTemplates(document.getElementById('schedulerTabBody'));
        toast('Template saved');
    };
}

// Merges a patch into the weight log for a given date without clobbering
// fields (like the other-meal weight) that weren't part of this update.
function upsertWeightLog(date, patch){
  const existing = App.data.weightLogs.find(w=>w.date===date);
  if(existing){ Object.assign(existing, patch); }
  else { App.data.weightLogs.push({date, ...patch}); }
}

function openLogWeightModal(){
  const root = document.getElementById('modalRoot');
  const date = todayStr();
  const existing = App.data.weightLogs.find(w=>w.date===date);
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h2>Log Weight</h2><button class="modal-close" id="mc">&times;</button></div>
        <div class="field"><label>Date</label><input type="date" id="wDate" value="${date}"></div>
        <div class="field"><label>Weight before meal (kg)</label><input type="number" id="wKg" step="0.1" value="${existing&&existing.kg!=null?existing.kg:App.activeProfile.weightKg}"></div>
        <div class="field"><label>Weight after meal (kg) <span class="muted" style="font-weight:400;">optional</span></label><input type="number" id="wKgAfter" step="0.1" value="${existing&&existing.kgAfter!=null?existing.kgAfter:''}" placeholder="e.g. 71.2"></div>
        <button class="btn primary block" id="saveWeightBtn">Save</button>
      </div>
    </div>`;
  document.getElementById('mc').onclick = closeModal;
  document.getElementById('mb').onclick = (e)=>{ if(e.target.id==='mb') closeModal(); };
  document.getElementById('wDate').onchange = (e)=>{
    const ex = App.data.weightLogs.find(w=>w.date===e.target.value);
    document.getElementById('wKg').value = ex&&ex.kg!=null ? ex.kg : App.activeProfile.weightKg;
    document.getElementById('wKgAfter').value = ex&&ex.kgAfter!=null ? ex.kgAfter : '';
  };
  document.getElementById('saveWeightBtn').onclick = ()=>{
    const date = document.getElementById('wDate').value;
    const kgRaw = document.getElementById('wKg').value;
    const kgAfterRaw = document.getElementById('wKgAfter').value;
    const kg = kgRaw ? +kgRaw : null;
    const kgAfter = kgAfterRaw ? +kgAfterRaw : null;
    if(!kg && !kgAfter){ toast('Enter at least one weight'); return; }
    const patch = {};
    if(kg) patch.kg = kg;
    if(kgAfter) patch.kgAfter = kgAfter;
    else if(kgAfterRaw==='') { /* leave existing kgAfter untouched */ }
    upsertWeightLog(date, patch);
    if (kg && date >= todayStr()) {
        App.activeProfile.weightKg = kg;
        if (!App.activeProfile.useCustomCalories) {
            App.activeProfile.targets = calcTargets(App.activeProfile);
        }
    }
    saveProfiles(App.profiles);
    persist(); closeModal(); toast('Weight logged'); renderProgressPage();
  };
}

function estOneRMFromSet(s){ return s.weight && s.reps ? estOneRM(s.weight, s.reps) : 0; }

function renderStrengthProgressionList(){
  const prIds = Object.keys(App.data.prs||{});
  if(prIds.length===0) return `<div class="empty-state"><span class="ic">📈</span><p>Set a PR to see your strength curve.</p></div>`;
  return prIds.map(id=>{
    const ex = EXERCISE_LIBRARY.find(x=>x.id===id);
    if(!ex || ex.cat==='Cardio') return '';
    const points = [];
    App.data.workouts.filter(w=>w.exercises.some(e=>e.exerciseId===id)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
      const e = w.exercises.find(e=>e.exerciseId===id);
      const best = Math.max(0, ...e.sets.map(estOneRMFromSet));
      if(best>0) points.push({date:w.date, val:Math.round(best)});
    });
    if(points.length<2) return '';
    const w=140,h=40,pad=4;
    const vals = points.map(p=>p.val);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min)||1;
    const step = (w-2*pad)/(points.length-1);
    const coords = points.map((p,i)=>`${(pad+i*step).toFixed(1)},${(h-pad-((p.val-min)/range)*(h-2*pad)).toFixed(1)}`).join(' ');
    const last = points[points.length-1];
    const first = points[0];
    const trendUp = last.val >= first.val;
    return `<div class="sparkline-item">
      <div class="sp-info"><div class="sp-title">${ex.name}</div><div class="sp-sub">Est. 1RM: ${first.val}kg → <strong style="color:var(--text);">${last.val}kg</strong> (${points.length} sessions)</div></div>
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${coords}" fill="none" stroke="${trendUp?'var(--accent2)':'var(--danger)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  }).filter(Boolean).join('') || `<div class="empty-state"><span class="ic">📈</span><p>Log the same lift more than once to see a progression curve.</p></div>`;
}

/* ---- Body composition (US Navy method) ---- */
function calcBodyFatPct(m, sex, heightCm){
  if(!m || !m.waist || !m.neck || !heightCm) return null;
  if(sex==='female'){
    if(!m.hip) return null;
    const v = m.waist + m.hip - m.neck;
    if(v<=0) return null;
    return round1(495 / (1.29579 - 0.35004*Math.log10(v) + 0.22100*Math.log10(heightCm)) - 450);
  }
  const v = m.waist - m.neck;
  if(v<=0) return null;
  return round1(495 / (1.0324 - 0.19077*Math.log10(v) + 0.15456*Math.log10(heightCm)) - 450);
}

function renderBodyFatChart(){
  const ctx = document.getElementById('bodyFatChart');
  if(!ctx) return;
  const p = App.activeProfile;
  const logs = [...App.data.measurementLogs].sort((a,b)=>a.date.localeCompare(b.date));

  const wrap = document.getElementById('bodyFatCurrentWrap');

  }

  if(points.length===0){ ctx.parentElement.insertAdjacentHTML('beforeend', '<p class="help center" style="margin-top:-20px;">No body-fat estimate yet — log neck & waist above.</p>'); return; }
  App.charts.bodyFat = new Chart(ctx, {

    options: baseChartOpts({legend:false})
  });
}

/* ---- IndexedDB-backed progress photo storage ---- */
const IDB_NAME = 'parakarom_photos_db';
const IDB_STORE = 'photos';
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB not supported')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
async function idbSetPhoto(key, dataUrl){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(dataUrl, key);
    tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetPhoto(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function idbDeletePhoto(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}

function resizeImageFile(file, maxDim=900){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(e, date){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageFile(file);

}

async function renderCompareSlider(beforeId, afterId){
  const wrap = document.getElementById('cmpSliderWrap');
  if(!wrap) return;
  wrap.innerHTML = '<p class="help center">Loading photos…</p>';
  try{
    const [beforeUrl, afterUrl] = await Promise.all([idbGetPhoto(beforeId), idbGetPhoto(afterId)]);
    wrap.innerHTML = `
      <div class="compare-slider-wrap" id="compareBox">
        <span class="compare-label" style="left:8px;">Before</span>
        <span class="compare-label" style="right:8px;">After</span>
        <img src="${beforeUrl}" alt="Before">
        <div class="after-wrap" id="afterWrap"><img src="${afterUrl}" alt="After" id="afterImg"></div>
        <div class="compare-handle" id="compareHandle"></div>
      </div>`;
    const box = document.getElementById('compareBox');
    const afterWrap = document.getElementById('afterWrap');
    const handle = document.getElementById('compareHandle');
    function setPos(pct){
      pct = clamp(pct,0,100);
      afterWrap.style.width = pct+'%';
      handle.style.left = pct+'%';
      document.getElementById('afterImg').style.width = box.clientWidth+'px';
    }
    setPos(50);
    let dragging = false;
    const move = (clientX)=>{
      const rect = box.getBoundingClientRect();
      setPos(((clientX-rect.left)/rect.width)*100);
    };
    handle.addEventListener('mousedown', ()=>dragging=true);
    window.addEventListener('mouseup', ()=>dragging=false);
    window.addEventListener('mousemove', (e)=>{ if(dragging) move(e.clientX); });
    box.addEventListener('touchstart', ()=>dragging=true);
    window.addEventListener('touchend', ()=>dragging=false);
    box.addEventListener('touchmove', (e)=>{ if(dragging && e.touches[0]) move(e.touches[0].clientX); });
    box.addEventListener('click', (e)=>move(e.clientX));
  }catch(err){
    wrap.innerHTML = '<p class="help center">Could not load photos.</p>';
  }
}

function goalProgress(g){
  if(g.type==='weight'){
    const cur = App.activeProfile.weightKg;
    const start = g.startValue;
    const total = Math.abs(g.target-start)||1;
    const done = Math.abs(cur-start);
    return clamp(done/total,0,1);
  }
  if(g.type==='workouts'){
    const count = App.data.workouts.filter(w=>w.date>=g.startDate).length;
    return clamp(count/g.target,0,1);
  }
  if(g.type==='exercise-pr'){
    const pr = App.data.prs[g.exerciseId];
    const cur = pr ? pr.est1RM : 0;
    const total = Math.max(1, g.target - (g.startValue||0));
    return clamp((cur-(g.startValue||0))/total, 0, 1);
  }
  return g.done?1:0;
}

function renderGoalRow(g){
  const pct = Math.round(goalProgress(g)*100);
  let sub = '';
  if(g.type==='weight') sub = `Target ${g.target}kg (from ${g.startValue}kg)`;
  else if(g.type==='workouts') sub = `${g.target} workouts by ${fmtDate(g.deadline||todayStr())}`;
  else if(g.type==='exercise-pr'){
    const ex = EXERCISE_LIBRARY.find(x=>x.id===g.exerciseId);
    const pr = App.data.prs[g.exerciseId];
    sub = `${ex?ex.name:'Exercise'} — target ${g.target}kg est. 1RM (current: ${pr?Math.round(pr.est1RM):0}kg) — auto-completes on PR`;
  }
  else sub = g.deadline ? `Due ${fmtDate(g.deadline)}` : 'Custom goal';
  return `<div class="item-row" style="flex-direction:column;align-items:stretch;gap:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="ii-main"><div class="ii-title">${g.done?'✅ ':''}${escapeHtml(g.title)}</div><div class="ii-sub">${sub}</div></div>
      <div class="ii-actions">
        <button class="btn sm ${g.done?'':'primary'}" data-done="${g.id}">${g.done?'Undo':'Complete'}</button>
        <button class="iconbtn danger" data-delg="${g.id}">🗑</button>
      </div>
    </div>
    ${g.type!=='custom' ? `<div class="progress-bar"><i style="width:${pct}%"></i></div>` : ''}
  </div>`;
}

      g.target = +document.getElementById('gTarget').value;
      const pr = App.data.prs[g.exerciseId];
      g.startValue = pr ? pr.est1RM : 0;
    }
    if(type==='custom'){ g.deadline=document.getElementById('gDeadline').value; }
    App.data.goals = App.data.goals||[];
    App.data.goals.push(g);
    persist(); closeModal(); renderGoalsPage(); toast('Goal added');
  };
  renderExtra();
}

let libCat = 'All';
function renderLibraryPage(){
  const page = document.getElementById('page-library');
  page.innerHTML = getAnimeQuote('library') + `
    <div class="search-row"><input type="text" id="libSearch" placeholder="Search exercises..."></div>
    <div class="tabs" id="libCatTabs">
      ${EXERCISE_CATS.map(c=>`<button data-c="${c}" class="${c===libCat?'active':''}">${c}</button>`).join('')}
    </div>
    <div class="list" id="libList"></div>`;
  document.getElementById('libSearch').oninput = refreshLibList;
  document.getElementById('libCatTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ libCat=b.dataset.c; renderLibraryPage(); });
  refreshLibList();
}
function refreshLibList(){
  const q = (document.getElementById('libSearch')?.value||'').toLowerCase();
  const list = EXERCISE_LIBRARY.filter(e=>
    (libCat==='All'||e.cat===libCat) &&
    e.name.toLowerCase().includes(q));
  document.getElementById('libList').innerHTML = list.map(e=>{
    const pr = App.data.prs[e.id];
    return `<div class="item-row" style="cursor:pointer;" data-lib="${e.id}">
      <div class="ii-main"><div class="ii-title">${e.name}</div><div class="ii-sub">${e.cat} (${e.variation}) · ${e.equip}</div></div>
      ${pr?`<span class="chip on">PR ${pr.weight}kg×${pr.reps}</span>`:'<span class="chip">→</span>'}
    </div>`;
  }).join('') || '<div class="empty-state"><p>No exercises match.</p></div>';
  document.getElementById('libList').querySelectorAll('[data-lib]').forEach(el=>{
    el.onclick = ()=>openExerciseDetail(el.dataset.lib);
  });
}
function openExerciseDetail(id){
  const ex = EXERCISE_LIBRARY.find(x=>x.id===id);
  const pr = App.data.prs[id];
  const isCardio = ex && ex.cat === 'Cardio';
  const history = App.data.workouts.filter(w=>w.exercises.some(e=>e.exerciseId===id))
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal">
        <div class="modal-head"><h2>${ex.name}</h2><button class="modal-close" id="mc">&times;</button></div>
        <div class="chiprow mt" style="margin-bottom:14px;">
          <span class="chip on">${ex.cat} (${ex.variation})</span>
          ${ex.secondary.map(s=>`<span class="chip">${MUSCLE_LABEL[s]}</span>`).join('')}
          <span class="chip">${ex.equip}</span>
        </div>
        ${pr ? `<div class="stat-box" style="margin-bottom:14px;"><div class="num">${formatSet(pr, isCardio)}</div><div class="lbl">Personal Record</div></div>` : ''}
        <h3>Recent Sessions</h3>
        ${history.length===0 ? '<p class="muted" style="font-size:13px;">Not logged yet.</p>' :
        `<div class="list">${history.map(w=>{
          const de = w.exercises.find(e=>e.exerciseId===id);
          const setsTxt = de.sets.map(s=>formatSet(s, isCardio)).join(', ');
          return `<div class="item-row"><div class="ii-main"><div class="ii-title">${fmtDate(w.date)}</div><div class="ii-sub">${setsTxt}</div></div></div>`;
        }).join('')}</div>`}
        <button class="btn primary block mt" id="logThisBtn">Add to Today's Workout</button>
      </div>
    </div>`;
  document.getElementById('mc').onclick = closeModal;
  document.getElementById('mb').onclick = (e)=>{ if(e.target.id==='mb') closeModal(); };
  document.getElementById('logThisBtn').onclick = ()=>{
    App.workoutDraft.exercises.push({exerciseId:id, sets:[{reps:0,weight:0}]});
    closeModal(); toast('Added to draft workout'); navigate('workout'); workoutTab='log'; renderWorkoutPage();
  };
}

/* ---------- Equipment / Machine Availability ---------- */
// Gyms vary a lot in which specific machines they stock (pec deck vs shoulder press machine,
// preacher curl machine vs bicep curl machine, etc). Barbell/Dumbbell/Bodyweight gear is assumed
// universally available. Cable/pulley stations are treated as ONE flexible piece of equipment —
// confirming "Cable Machine" once covers every cable-based exercise across every muscle group,
// since a single adjustable cable station can do lat pulldowns, curls, pushdowns, rows, etc.
// Single-purpose machines (pec deck, leg press, preacher curl machine...) are each their own
// specific toggle so a gym missing one doesn't block exercises that use a different machine.
const EQUIP_CONFIRM_TYPES = ['Machine','Cable'];
function classifyMachineExercise(ex){
  const hay = ((ex.id||'')+' '+(ex.name||'')).toLowerCase();
  if(ex.equip==='Cable') return {key:'cable_station', label:'Cable Machine / Cable Station'};
  if(ex.cat==='Forearm' && /cable|rope/.test(hay)) return {key:'cable_station', label:'Cable Machine / Cable Station'};
  if(/smith machine/.test(hay)) return {key:'smith_machine', label:'Smith Machine'};
  if(ex.cat==='Chest'){
    if(/pec.?deck|fly/.test(hay)) return {key:'pec_deck_machine', label:'Pec Deck / Chest Fly Machine'};
    return {key:'chest_press_machine', label:'Chest Press Machine'};
  }
  if(ex.cat==='Shoulder'){
    if(/shrug/.test(hay)) return {key:'shrug_machine', label:'Shrug Machine'};
    if(/rear.?delt|reverse pec deck/.test(hay)) return {key:'rear_delt_machine', label:'Rear-Delt / Reverse Pec Deck Machine'};
    if(/lateral raise|abduction/.test(hay)) return {key:'lateral_raise_machine', label:'Lateral Raise Machine'};
    if(/upright row|high row|high pull|face pull/.test(hay)) return {key:'row_face_pull_machine', label:'Upright Row / Face-Pull Machine'};
    if(/rotation|rotator/.test(hay)) return {key:'rotator_cuff_machine', label:'Rotator Cuff Machine'};
    return {key:'shoulder_press_machine', label:'Shoulder Press Machine'};
  }
  if(ex.cat==='Bicep'){
    if(/preacher/.test(hay)) return {key:'preacher_curl_machine', label:'Preacher Curl Machine'};
    return {key:'bicep_curl_machine', label:'Bicep Curl Machine'};
  }
  if(ex.cat==='Back' || ex.cat==='Lat'){
    if(/t.?bar/.test(hay)) return {key:'t_bar_row_machine', label:'T-Bar Row Machine'};
    return {key:'other_back_machine', label:'Other Back Machine'};
  }
  if(ex.cat==='Legs'){
    if(/calf/.test(hay)) return {key:'calf_raise_machine', label:'Calf Raise Machine'};
    if(/leg extension/.test(hay)) return {key:'leg_extension_machine', label:'Leg Extension Machine'};
    if(/leg curl|hamstring curl|nordic curl|glute-ham raise/.test(hay)) return {key:'leg_curl_machine', label:'Leg Curl Machine'};
    if(/hip abduction|outer.?thigh/.test(hay)) return {key:'hip_abduction_machine', label:'Hip Abduction Machine'};
    if(/hip adduction|inner.?thigh/.test(hay)) return {key:'hip_adduction_machine', label:'Hip Adduction Machine'};
    if(/glute|hip thrust|hip extension|kickback|hyperextension/.test(hay)) return {key:'glute_machine', label:'Glute Machine (Hip Thrust / Kickback)'};
    if(/sled/.test(hay)) return {key:'sled_machine', label:'Sled Push / Drag Machine'};
    if(/leg press|hack squat|v-?squat|belt squat|pendulum|leverage squat|machine squat|split squat|step-up|lateral squat|reverse lunge/.test(hay)) return {key:'leg_press_squat_machine', label:'Leg Press / Hack Squat Machine'};
    return {key:'other_leg_machine', label:'Other Leg Machine'};
  }
  if(ex.cat==='Forearm') return {key:'forearm_wrist_machine', label:'Wrist / Forearm Machine'};
  return {key:'other_'+(ex.cat||'misc').toLowerCase()+'_machine', label:'Other '+(ex.cat||'Misc')+' Machine'};
}
function equipGroupKey(ex){ return classifyMachineExercise(ex).key; }
function buildEquipmentGroups(){
  const groups = {};
  EXERCISE_LIBRARY.forEach(ex=>{
    if(!EQUIP_CONFIRM_TYPES.includes(ex.equip) || ex.cat==='Cardio') return;
    const {key,label} = classifyMachineExercise(ex);
    if(!groups[key]) groups[key] = {key, label, exampleNames:[], exerciseIds:[]};
    groups[key].exerciseIds.push(ex.id);
    if(groups[key].exampleNames.length<3) groups[key].exampleNames.push(ex.name);
  });
  return Object.values(groups);
}

const MAJOR_MUSCLES = ['chest','back','shoulders','quads'];
function exerciseCountForMuscle(muscle){
  if(MAJOR_MUSCLES.includes(muscle)) return 3;
  if(muscle==='abs') return 1;
  return 2;
}
// Caps a day's total working-set load: starts from ideal per-muscle counts, then trims the
// currently-highest count (favoring minor muscles on a tie) until the day fits a realistic budget.
function computeDayExerciseCounts(muscles, budget){
  budget = budget || 8;
  const counts = {};
  muscles.forEach(m=>{ counts[m] = exerciseCountForMuscle(m); });
  let total = muscles.reduce((a,m)=>a+counts[m],0);
  while(total>budget){
    let target = null;
    muscles.forEach(m=>{
      if(counts[m]<=1) return;
      if(target===null){ target=m; return; }
      const mIsMajor = MAJOR_MUSCLES.includes(m), tIsMajor = MAJOR_MUSCLES.includes(target);
      if(counts[m]>counts[target]) target=m;
      else if(counts[m]===counts[target] && !mIsMajor && tIsMajor) target=m;
    });
    if(!target) break;
    counts[target]--; total--;
  }
  return counts;
}

function starScoreFromVote(v){
  if(!v) return 0;
  const full = (v.match(/⭐/g)||[]).length;
  const half = v.includes('½') ? 0.5 : 0;
  return full + half;
}
function normExName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function computeExerciseEffectiveness(){
  ensureAnalyzerData();
  const rows = [...(App.data.analyzer.aVotes||[]), ...(App.data.analyzer.bVotes||[])];
  const bestRows = [...(App.data.analyzer.aBest||[]), ...(App.data.analyzer.bBest||[])];
  const map = {};
  EXERCISE_LIBRARY.forEach(ex=>{
    const nEx = normExName(ex.name);
    let best = 0, isBestPick = false;
    rows.forEach(r=>{
      if(!r.exercise) return;
      const nR = normExName(r.exercise);
      if(nR.length<4) return;
      if(nEx.includes(nR) || nR.includes(nEx)){
        const s = starScoreFromVote(r.myVote);
        if(s>best) best = s;
      }
    });
    bestRows.forEach(r=>{
      [[r.best,1],[r.second,0.5],[r.third,0.25]].forEach(([name,bonus])=>{
        if(!name) return;
        const nR = normExName(name);
        if(nR.length<4) return;
        if(nEx.includes(nR) || nR.includes(nEx)){
          if(bonus===1) isBestPick = true;
          best = Math.max(best, 4 + bonus);
        }
      });
    });
    map[ex.id] = {score:best, isHighEffective: best>=4.5 || isBestPick};
  });
  return map;
}

function draftSetsForExercise(exerciseId){
  const workouts = [...App.data.workouts].sort((a,b)=>b.date.localeCompare(a.date));
  let baseReps = 10, baseWeight = 0;
  for(const w of workouts){
    const found = w.exercises.find(e=>e.exerciseId===exerciseId);
    if(found && found.sets && found.sets.length){
      const last = found.sets[found.sets.length-1];
      baseReps = last.reps || baseReps;
      baseWeight = (last.weight!=null) ? last.weight : baseWeight;
      break;
    }
  }
  return [0,1,2].map(()=>({reps:baseReps, weight:baseWeight}));
}

function pickForMuscle(muscle, n, dateStr, usageMap, effMap){
  let pool = EXERCISE_LIBRARY.filter(e=>e.primary===muscle && e.cat!=='Cardio');
  // Respect the gym's confirmed machine/cable availability — never draft an exercise that
  // needs equipment the user told us their gym doesn't have.
  pool = pool.filter(e=> !EQUIP_CONFIRM_TYPES.includes(e.equip) || isEquipGroupAvailable(equipGroupKey(e)));
  if(pool.length===0) return [];
  const annotated = pool.map(e=>{
    const eff = effMap[e.id] || {score:0, isHighEffective:false};
    const lastUsed = usageMap[e.id];
    const gap = lastUsed ? daysBetween(lastUsed, dateStr) : 999;
    const recentlyUsed = gap>=0 && gap<=3;
    return {ex:e, score:eff.score, isHighEffective:eff.isHighEffective, recentlyUsed};
  });
  let allowed = annotated.filter(a=>!a.recentlyUsed || a.isHighEffective);
  if(allowed.length < n) allowed = annotated.slice();
  allowed.sort((a,b)=> (b.score-a.score) || ((a.recentlyUsed?1:0)-(b.recentlyUsed?1:0)) || (Math.random()-0.5));
  const chosen = [];
  for(const a of allowed){
    if(chosen.length>=n) break;
    chosen.push(a);
  }
  // if forced into an all-repeat set for a multi-exercise muscle, swap one slot for a fresh pick to satisfy "mix in a new exercise"
  if(n>1 && chosen.length && chosen.every(c=>c.recentlyUsed)){
    const fresh = annotated.find(a=>!a.recentlyUsed && !chosen.some(c=>c.ex.id===a.ex.id));
    if(fresh) chosen[chosen.length-1] = fresh;
  }
  chosen.forEach(c=>{ usageMap[c.ex.id] = dateStr; });
  return chosen.map(c=>({
    exerciseId:c.ex.id,
    isHighEffective: !!c.isHighEffective,
    isFreshPick: !c.recentlyUsed,
    sets: draftSetsForExercise(c.ex.id)
  }));
}

function pickExercisesForDay(muscles, optional, dateStr, usageMap, effMap){
  let out = [];
  const counts = computeDayExerciseCounts(muscles||[]);
  (muscles||[]).forEach(m=>{ out = out.concat(pickForMuscle(m, counts[m], dateStr, usageMap, effMap)); });
  (optional||[]).forEach(m=>{ out = out.concat(pickForMuscle(m, 1, dateStr, usageMap, effMap)); });
  return out;
}

function detectNextRotationIndex(rotation){
  if(!App.data.workouts.length) return 0;
  const last = [...App.data.workouts].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const musclesUsed = new Set(last.exercises.map(e=>{
    const ex = EXERCISE_LIBRARY.find(x=>x.id===e.exerciseId); return ex ? ex.primary : null;
  }).filter(Boolean));
  let bestIdx = 0, bestScore = -1;
  rotation.forEach((slot,idx)=>{
    const overlap = slot.muscles.filter(m=>musclesUsed.has(m)).length;
    if(overlap>bestScore){ bestScore = overlap; bestIdx = idx; }
  });
  return (bestIdx+1) % rotation.length;
}

function generateWorkoutPlan(opts){
  const splitDef = opts.splitKey==='custom' ? {name:'Custom Split', days:opts.customDays} : SPLIT_PRESETS[opts.splitKey];
  const rotation = splitDef.days.filter(d=>d.muscles && d.muscles.length);
  if(!rotation.length) return null;
  const effMap = computeExerciseEffectiveness();
  const usageMap = buildUsageMapFromHistory();
  const startDate = opts.startDate || todayStr();
  const daysPerWeek = clamp(opts.daysPerWeek||6, 1, 7);

  let planDays = [];
  if(opts.scope==='day'){
    const idx = opts.singleDayIndex==='auto' ? detectNextRotationIndex(rotation) : (opts.singleDayIndex||0);
    const slot = rotation[idx % rotation.length];
    const exercises = pickExercisesForDay(slot.muscles, slot.optional, startDate, usageMap, effMap);
    planDays.push({id:uid(), dayNumber:1, label:slot.label, muscles:slot.muscles, optionalMuscles:slot.optional||[], date:startDate, exercises, completed:false, isRest:false, loggedWorkoutId:null});
  } else {
    const totalCalendarDays = opts.scope==='week' ? 7 : 28;
    let rotIdx = 0;
    for(let i=0;i<totalCalendarDays;i++){
      const dStr = addDays(startDate, i);
      const isRest = (i % 7) >= daysPerWeek;
      if(isRest){
        planDays.push({id:uid(), dayNumber:i+1, label:'Rest Day', muscles:[], optionalMuscles:[], date:dStr, exercises:[], completed:false, isRest:true, loggedWorkoutId:null});
        continue;
      }
      const slot = rotation[rotIdx % rotation.length];
      rotIdx++;
      const exercises = pickExercisesForDay(slot.muscles, slot.optional, dStr, usageMap, effMap);
      planDays.push({id:uid(), dayNumber:i+1, label:slot.label, muscles:slot.muscles, optionalMuscles:slot.optional||[], date:dStr, exercises, completed:false, isRest:false, loggedWorkoutId:null});
    }
  }
  return {
    id:uid(), createdAt:new Date().toISOString(), scope:opts.scope, splitName:splitDef.name,
    daysPerWeek, days:planDays, status:'active', completedAt:null
  };
}

function handleGenerateDraft(){
  const s = autoDraftState;
  if(s.splitKey==='custom'){
    s.customDays = s.customDays.map(d=>({...d, label: d.label && d.label.trim() ? d.label.trim() : 'Custom Day'}));
    if(!s.customDays.some(d=>d.muscles.length)){ toast('Add at least one muscle group to a custom day'); return; }
  }
  // Save the confirmed machine/cable availability so the draft respects it, and so future
  // drafts remember the gym's equipment without asking again from scratch.
  ensureEquipmentPrefs();
  Object.keys(s.equipAvailability).forEach(k=>{ App.data.equipmentPrefs[k] = s.equipAvailability[k]; });
  persist();
  const doGenerate = ()=>{
    const plan = generateWorkoutPlan(s);
    if(!plan){ toast('Could not generate a plan — check your split'); return; }
    ensurePlansData();
    App.data.workoutPlans.forEach(p=>{ if(p.status==='active') p.status='archived'; });
    App.data.workoutPlans.unshift(plan);
    persist();
    document.getElementById('modalRoot').innerHTML = '';
    planUiState.activeDayId = plan.days.find(d=>!d.isRest)?.id || plan.days[0]?.id || null;
    refreshPlanHost();
    toast('Plan drafted! Review, edit, and mark days complete as you go 💪');
  };
  const existing = getActivePlan();
  if(existing){
    confirmDialog('You already have an active plan. Replace it with this new draft? (The old one moves to history.)', doGenerate, {yesLabel:'Replace', danger:false});
  } else doGenerate();
}

// Wires up all plan-related click/change interactions for a container. Used by both the
// Analyzer's compact preview card and the Workout page's full Plan tab.
function attachPlanControls(container){
  container.addEventListener('click', (e)=>{
    const openAd = e.target.closest('#openAutoDraftBtn');
    if(openAd){ openAutoDraftModal(); return; }
    const openFull = e.target.closest('#planOpenFullBtn');
    if(openFull){ workoutTab = 'plan'; navigate('workout'); return; }
    const dayTab = e.target.closest('[data-planday]');
    if(dayTab){ planUiState.activeDayId = dayTab.dataset.planday; refreshPlanHost(); return; }
    const markAll = e.target.closest('#planMarkAllBtn');
    if(markAll){ markWholePlanComplete(); return; }
    const discardBtn = e.target.closest('#planDiscardBtn');
    if(discardBtn){ discardActivePlan(); return; }
    const markDay = e.target.closest('[data-plan-markday]');
    if(markDay){ const [pid,did] = markDay.dataset.planMarkday.split(':'); markPlanDayComplete(pid,did); return; }
    const logDay = e.target.closest('[data-plan-logday]');
    if(logDay){ const [pid,did] = logDay.dataset.planLogday.split(':'); logPlanDayAsWorkout(pid,did); return; }
    const addExBtn = e.target.closest('[data-planaddday]');
    if(addExBtn){ addPlanExercise(getActivePlan()?.id, addExBtn.dataset.planaddday); return; }
    const rmExBtn = e.target.closest('[data-plan-rmex]');
    if(rmExBtn){ const [pid,did,ei] = rmExBtn.dataset.planRmex.split(':'); removePlanExercise(pid,did,+ei); return; }
    const swapBtn = e.target.closest('[data-plan-swap]');
    if(swapBtn){ const [pid,did,ei] = swapBtn.dataset.planSwap.split(':'); swapPlanExercise(pid,did,+ei); return; }
    const delHist = e.target.closest('[data-plan-delhist]');
    if(delHist){
      confirmDialog('Remove this plan from history?', ()=>{
        App.data.workoutPlans = App.data.workoutPlans.filter(p=>p.id!==delHist.dataset.planDelhist);
        persist(); refreshPlanHost();
      }, {danger:true, yesLabel:'Remove'});
      return;
    }
  });
  container.addEventListener('change', (e)=>{
    const doneBox = e.target.closest('[data-plan-exdone]');
    if(doneBox){
      const [pid,did,ei] = doneBox.dataset.planExdone.split(':');
      const {day} = findPlanDay(pid,did);
      if(day && day.exercises[ei]){ day.exercises[ei].done = doneBox.checked; persist(); }
      return;
    }
    const setField = e.target.closest('[data-plan-set]');
    if(setField){
      const [pid,did,ei,si,field] = setField.dataset.planSet.split(':');
      const {day} = findPlanDay(pid,did);
      if(day && day.exercises[ei] && day.exercises[ei].sets[si]){
        day.exercises[ei].sets[si][field] = +setField.value || 0;
        persist();
      }
      return;
    }
  });
}
