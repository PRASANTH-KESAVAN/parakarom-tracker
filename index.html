        const prog = planProgress(p);
        return `<div class="plan-history-item">
          <div><div class="phi-title">${escapeHtml(p.splitName)}</div><div class="phi-sub">${new Date(p.createdAt).toLocaleDateString()} · ${prog.done}/${prog.total} days · ${p.status}</div></div>
          <button class="iconbtn danger" data-plan-delhist="${p.id}">🗑</button>
        </div>`;
      }).join('')}
    </div>`;
}

function findPlanDay(planId, dayId){
  ensurePlansData();
  const plan = App.data.workoutPlans.find(p=>p.id===planId);
  const day = plan && plan.days.find(d=>d.id===dayId);
  return {plan, day};
}
function maybeAutoCompletePlan(plan){
  const workoutDays = plan.days.filter(d=>!d.isRest);
  if(workoutDays.length && workoutDays.every(d=>d.completed) && plan.status==='active'){
    plan.status = 'completed';
    plan.completedAt = new Date().toISOString();
    toast('🎉 Plan complete — great work!');
  }
}
// Small 3-way modal used any time completing a day/plan could also mean logging it to
// workout history — per your preference, Claude asks each time rather than guessing.
function askPlanCompletionChoice(message, onJustMark, onLogToo){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="apcBackdrop">
      <div class="modal confirm-box" style="max-width:380px;">
        <div class="modal-head"><h2>Mark as Complete</h2></div>
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions apc-actions">
          <button class="btn primary block" id="apcLogToo">✔ Complete &amp; Log to History</button>
          <button class="btn block" id="apcJustMark">Just Mark Complete</button>
          <button class="btn ghost block" id="apcCancel">Cancel</button>
        </div>
      </div>
    </div>`;
  document.getElementById('apcCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('apcBackdrop').onclick = (e)=>{ if(e.target.id==='apcBackdrop') root.innerHTML=''; };
  document.getElementById('apcJustMark').onclick = ()=>{ root.innerHTML=''; onJustMark(); };
  document.getElementById('apcLogToo').onclick = ()=>{ root.innerHTML=''; onLogToo(); };
}
function markPlanDayComplete(planId, dayId){
  const {plan, day} = findPlanDay(planId, dayId);
  if(!plan || !day) return;
  if(day.completed){
    // Unmarking needs no prompt — just revert.
    day.completed = false;
    day.exercises.forEach(ex=>ex.done=false);
    persist(); refreshPlanHost();
    return;
  }
  askPlanCompletionChoice(
    `Mark "${day.label||'this day'}" complete. Should Claude also log it to your workout history?`,
    ()=>{
      day.completed = true;
      day.exercises.forEach(ex=>ex.done=true);
      maybeAutoCompletePlan(plan);
      persist(); refreshPlanHost();
      toast('Day marked complete');
    },
    ()=> logPlanDayAsWorkout(planId, dayId)
  );
}
function logPlanDayAsWorkout(planId, dayId){
  const {plan, day} = findPlanDay(planId, dayId);
  if(!plan || !day || day.exercises.length===0) return;
  const exercises = day.exercises.map(ex=>({exerciseId:ex.exerciseId, sets: ex.sets.map(s=>({reps:+s.reps||0, weight:+s.weight||0, rpe:null})), superset:null}));
  App.data.workouts.push({id:uid(), date: day.date || todayStr(), exercises});
  day.completed = true;
  day.exercises.forEach(ex=>ex.done=true);
  maybeAutoCompletePlan(plan);
  persist(); refreshPlanHost();
  toast('Logged to your workout history!');
}
function discardActivePlan(){
  const active = getActivePlan();
  if(!active) return;
  confirmDialog('Discard this drafted plan? This cannot be undone.', ()=>{
    App.data.workoutPlans = App.data.workoutPlans.filter(p=>p.id!==active.id);
    persist(); refreshPlanHost(); toast('Plan discarded');
  }, {danger:true, yesLabel:'Discard'});
}
function markWholePlanComplete(){
  const active = getActivePlan();
  if(!active) return;
  askPlanCompletionChoice(
    'Mark the entire plan complete. Should Claude also log the remaining days to your workout history?',
    ()=>{
      active.days.forEach(d=>{ if(!d.isRest){ d.completed=true; d.exercises.forEach(ex=>ex.done=true); } });
      active.status='completed'; active.completedAt=new Date().toISOString();
      persist(); refreshPlanHost(); toast('🎉 Plan marked complete!');
    },
    ()=>{
      active.days.forEach(d=>{
        if(d.isRest || d.completed || !d.exercises.length) return;
        const exercises = d.exercises.map(ex=>({exerciseId:ex.exerciseId, sets: ex.sets.map(s=>({reps:+s.reps||0, weight:+s.weight||0, rpe:null})), superset:null}));
        App.data.workouts.push({id:uid(), date: d.date || todayStr(), exercises});
        d.completed = true; d.exercises.forEach(ex=>ex.done=true);
      });
      active.status='completed'; active.completedAt=new Date().toISOString();
      persist(); refreshPlanHost(); toast('🎉 Plan complete — logged to workout history!');
    }
  );
}
function removePlanExercise(planId, dayId, exIdx){
  const {day} = findPlanDay(planId, dayId);
  if(!day) return;
  day.exercises.splice(exIdx,1);
  persist(); refreshPlanHost();
}
function swapPlanExercise(planId, dayId, exIdx){
  const {plan, day} = findPlanDay(planId, dayId);
  if(!day) return;
  openExercisePicker((newExId)=>{
    day.exercises[exIdx] = {exerciseId:newExId, isHighEffective:false, isFreshPick:true, sets: draftSetsForExercise(newExId)};
    persist(); refreshPlanHost();
  });
}
function addPlanExercise(planId, dayId){
  const {day} = findPlanDay(planId, dayId);
  if(!day) return;
  openExercisePicker((exId, sets)=>{
    day.exercises.push({exerciseId:exId, isHighEffective:false, isFreshPick:true, sets: sets ? JSON.parse(JSON.stringify(sets)) : draftSetsForExercise(exId)});
    persist(); refreshPlanHost();
  });
}

function renderAnalyzerPage(){
  ensureAnalyzerData();
  ensurePlansData();
  const page = document.getElementById('page-analyzer');

  page.innerHTML = `
    <div class="card" style="text-align:center; margin-bottom: 20px; animation: slideInUp 0.3s backwards;">
      <h2 style="color: var(--accent); margin-bottom:8px;">🗳️ Workout Analyzer</h2>
      <p style="color: var(--text-dim); font-size: 14px; line-height: 1.5; margin:0;">
        A 5th-judge review comparing Workout A (foundation compounds) against Workout B (complementary variations) — fully editable so you can adjust ratings, add your own exercises, or tweak verdicts to match your own experience.
      </p>
    </div>
    ${renderPlanSection({full:false})}
    ${analyzerTableCardHTML('aVotes')}
    ${analyzerTableCardHTML('aBest')}
    ${analyzerTableCardHTML('bVotes')}
    ${analyzerTableCardHTML('bBest')}
    <div class="card" style="animation: slideInUp 0.3s backwards;">
      <h3 style="margin-bottom:8px;">🥇 Overall Conclusion</h3>
      <p style="color:var(--text-dim); font-size:13px; line-height:1.6; margin:0 0 8px;">Running A + B as a system beats repeating the same exercises twice a week. <b style="color:var(--text)">Workout A</b> covers heavier foundation movements with high mechanical tension. <b style="color:var(--text)">Workout B</b> adds different angles, more machines/cables, and more unilateral work with less repetitive joint stress.</p>
      <p style="color:var(--text-faint); font-size:12px; margin:0;">The strongest combinations from the tables are A + B together, rather than treating either one as universally "better."</p>
    </div>
  `;

  Object.keys(ANALYZER_TABLES).forEach(renderAnalyzerTable);
  attachPlanControls(page);

  // Delegated events for the whole page (analyzer-table specific — plan events are in attachPlanControls)
  page.onclick = (e)=>{
    const addBtn = e.target.closest('[data-analyzer-add]');
    if(addBtn){ addAnalyzerRow(addBtn.dataset.analyzerAdd); return; }
    const csvBtn = e.target.closest('[data-analyzer-csv]');
    if(csvBtn){ exportAnalyzerTableCSV(csvBtn.dataset.analyzerCsv); return; }
    const resetBtn = e.target.closest('[data-analyzer-reset]');
    if(resetBtn){ resetAnalyzerTable(resetBtn.dataset.analyzerReset); return; }
    const delBtn = e.target.closest('[data-del-row]');
    if(delBtn){ deleteAnalyzerRow(delBtn.dataset.delTable, delBtn.dataset.delRow); return; }
  };

  page.addEventListener('focusout', (e)=>{
    const cell = e.target.closest('td[contenteditable="true"]');
    if(!cell) return;
    const {table, row, key} = cell.dataset;
    if(!table || !row || !key) return;
    const list = App.data.analyzer[table] || [];
    const rec = list.find(r=>r._id===row);
    if(!rec) return;
    const val = cell.textContent.trim();
    if(rec[key] !== val){
      rec[key] = val;
      persist();
    }
  });

  page.addEventListener('input', (e)=>{
    const key = e.target.dataset && e.target.dataset.analyzerSearch;
    if(key){
      analyzerFilters[key] = analyzerFilters[key] || {q:'', muscle:''};
      analyzerFilters[key].q = e.target.value;
      renderAnalyzerTable(key);
    }
  });
  page.addEventListener('change', (e)=>{
    const key = e.target.dataset && e.target.dataset.analyzerMusclefilter;
    if(key){
      analyzerFilters[key] = analyzerFilters[key] || {q:'', muscle:''};
      analyzerFilters[key].muscle = e.target.value;
      renderAnalyzerTable(key);
    }
  });
}

function setTheme(t){

function exportAllData(){
  const bundle = { profiles: App.profiles, activeProfileId: App.activeProfile.id, data: {} };
  App.profiles.forEach(p=>{ bundle.data[p.id] = loadProfileData(p.id); });
  const blob = new Blob([JSON.stringify(bundle,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `parakarom-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Data exported');
}

function importAllData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const bundle = JSON.parse(evt.target.result);
      if(!bundle.profiles || !bundle.data) throw new Error('bad format');
      confirmDialog('Import will replace all current profiles and data. Continue?', ()=>{
        saveProfiles(bundle.profiles);
        Object.keys(bundle.data).forEach(pid=>saveProfileData(pid, bundle.data[pid]));
        setActiveProfileId(bundle.activeProfileId || bundle.profiles[0].id);
        App.profiles = loadProfiles();
        loadActiveProfile(getActiveProfileId());
        showShell();
        toast('Data imported successfully');
      }, {yesLabel:'Import'});
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
